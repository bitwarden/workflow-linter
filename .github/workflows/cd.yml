name: CD

on:
  push:
    branches:
      - main
    # No paths-ignore: the bump PR's own merge re-triggers CD, and `resolve` skips it via the
    # PR's version:skip label. This keeps the pattern uniform for repos whose version lives in
    # a file with other content (e.g. Chart.yaml), which can't be path-ignored.

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version-bump:
    name: Version bump
    # Resolve bump type + idempotency, then merge the bump to main via update-repository.
    uses: ./.github/workflows/_version-bump.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    secrets: inherit

  publish:
    name: Publish via deploy repo
    needs: version-bump
    if: needs.version-bump.outputs.bump_type != 'skip'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Publish
        uses: bitwarden/gh-actions/trigger-actions@main
        with:
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          task: publish-workflow-linter
          data: '{"version": "${{ needs.version-bump.outputs.version }}", "sha": "${{ needs.version-bump.outputs.sha }}"}'
