; mypy replaced pytype as the type checker for this project. pytype's final release
; (2024.10.11) supports Python 3.12 at most and upstream has stated that will not change,
; so it could not follow the project onto Python 3.14.
;
; This is a pragmatic starting baseline rather than a strict configuration. The two
; relaxations below are deliberate and are documented with the reason they exist. Tightening
; them is worthwhile follow-up work, not something this config claims to have done.

[mypy]
python_version = 3.14
files = src
ignore_missing_imports = True

; The Rule base class declares fn(obj: Union[Workflow, Job, Step]) and every concrete rule
; narrows it to the single model it applies to. That is a Liskov violation in the strict
; sense, but it is the core of the plugin design, and Rule.execute() guards each call with a
; self.compatibility membership check before dispatching. Resolving this properly means
; making Rule generic over its target model.
disable_error_code = override

; There is a backlog of genuine Optional-handling gaps, mostly reading fields off Workflow
; and Job that are typed Optional but assumed present after parsing. Enabling strict optional
; surfaces roughly 30 of them. They are real and worth fixing, but they are a behavioral
; review rather than an annotation cleanup, so they are out of scope here.
strict_optional = False

; dataclasses-json injects from_dict() and to_dict() via the @dataclass_json decorator. It
; ships no mypy plugin, so those methods are invisible to static analysis. pytype had the
; same blind spot.
[mypy-bitwarden_workflow_linter.models.*]
disable_error_code = override, attr-defined
